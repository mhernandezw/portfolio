#  PROYECTOS DE GITHUB
#  Se muestran AUTOMÁTICAMENTE todos tus repos públicos (sin forks).
#  Aquí solo ajustas cómo se ven: descripción bilingüe, etiquetas, destacados
#  u ocultar alguno. Si un repo no tiene override, se usan la descripción y los
#  topics que tenga en GitHub.
# ----------------------------------------------------------------------------
