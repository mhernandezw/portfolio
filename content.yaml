  exclude_forks: true
  exclude_archived: false
  exclude:                     # Nombres de repos que NO quieres mostrar
    - mhernandezw              # (repo especial del README de perfil, si existe)
  overrides:
    microk8s-local-ai-stack:
      featured: true
      description:
        es: Manifiestos de Kubernetes para desplegar un stack local de automatización e IA (n8n, Ollama y Open WebUI) optimizado para MicroK8s.
        en: Kubernetes manifests to deploy a local AI & automation stack (n8n, Ollama and Open WebUI) optimised for MicroK8s.
      tags: [Kubernetes, MicroK8s, n8n, Ollama, Open WebUI]
    agente-eficiencia-energetica:
      featured: true
      description:
        es: Agente de IA en n8n que cruza la predicción horaria de AEMET con los precios PVPC de REE y envía cada día por Telegram recomendaciones para ahorrar energía manteniendo el confort térmico.
        en: n8n AI agent that combines AEMET hourly forecasts with REE electricity prices (PVPC) and sends daily Telegram recommendations to save energy while keeping thermal comfort.
      tags: [n8n, Google Gemini, Telegram, AEMET, REE]
    n8n-local-ai-compose:
      description:
        es: Despliegue documentado de n8n con IA local (Ollama + Open WebUI) mediante Docker Compose, con Traefik como proxy inverso y certificados TLS automáticos de Let's Encrypt.
        en: Documented deployment of n8n with local AI (Ollama + Open WebUI) using Docker Compose, with Traefik as reverse proxy and automatic Let's Encrypt TLS certificates.
      tags: [Docker Compose, n8n, Ollama, Traefik]
    portfolio:
      description:
        es: Este portafolio. Sitio estático con Astro y contenido en YAML, imagen construida con GitHub Actions y desplegada en MicroK8s detrás de NGINX Ingress y cert-manager.
        en: This portfolio. Static Astro site with YAML content, image built with GitHub Actions and deployed on MicroK8s behind NGINX Ingress and cert-manager.
      tags: [Astro, Kubernetes, GitHub Actions, NGINX]
