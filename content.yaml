  headline:
    es: >-
      Mantengo sistemas críticos disponibles, observables y automatizados.
      Del centro de datos 24x7 a la observabilidad SaaS, y ahora también
      Kubernetes e IA aplicada en mi home-lab.
    en: >-
      I keep critical systems available, observable and automated.
      From 24x7 data-center operations to SaaS observability, and now
      Kubernetes and applied AI in my home-lab.
  about:
    es:
      - >-
        Profesional en administración de sistemas informáticos e infraestructura con
        amplia trayectoria en **monitorización, observabilidad, automatización de flujos
        de trabajo críticos** y gestión avanzada de **copias de seguridad**. Experiencia
        acreditada en la administración operativa de entornos heterogéneos On-Premise y
        SaaS, asegurando la alta disponibilidad y la continuidad del negocio.
      - >-
        En Enagás gestiono la disponibilidad y el rendimiento de la infraestructura con
        OBM, NNM, SiteScope y Dynatrace, orquesto flujos críticos con Control-M y
        administro la protección de datos con Data Protector y Commvault Metallic.
      - >-
        Me formo de manera continua y pongo en práctica lo aprendido en un **home-lab
        sobre MicroK8s**, donde experimento con IA local (Ollama, Open WebUI) y
        automatización con n8n. Este mismo portafolio se sirve desde ese clúster.
    en:
      - >-
        Systems and infrastructure professional with a long track record in
        **monitoring, observability, automation of business-critical workflows** and
        advanced **backup management**. Proven experience operating heterogeneous
        on-premises and SaaS environments, ensuring high availability and business
        continuity.
      - >-
        At Enagás I manage infrastructure availability and performance with OBM, NNM,
        SiteScope and Dynatrace, orchestrate critical workflows with Control-M and run
        data protection with Data Protector and Commvault Metallic.
      - >-
        I keep learning continuously and put it into practice in a **MicroK8s
        home-lab**, where I experiment with local AI (Ollama, Open WebUI) and
        automation with n8n. This very portfolio is served from that cluster.
