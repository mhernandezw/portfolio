server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Detrás del Ingress: evita redirecciones absolutas a :8080 (p. ej. /en -> /en/)
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;

    # Cabeceras de seguridad (HSTS lo añade el Ingress NGINX al servir TLS)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # Sonda de salud para Kubernetes
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Assets con hash en el nombre: caché larga
    location /_astro/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
